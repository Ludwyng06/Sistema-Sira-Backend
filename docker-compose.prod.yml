# Demostración: servidor de la universidad o VPS pequeño.
# Uso: cp .env.prod.example .env.prod  (edita los secretos)  y luego
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api npx prisma migrate deploy
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api npx prisma db seed
name: sira-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: sira
      TZ: UTC
    volumes: ['pg_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sira']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: 3001
      TZ: UTC
      FRONTEND_URL: ${FRONTEND_URL:?define FRONTEND_URL}
      DATABASE_URL: postgresql://sira:${POSTGRES_PASSWORD}@postgres:5432/sira?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRETO: ${JWT_ACCESS_SECRETO:?define JWT_ACCESS_SECRETO}
      JWT_ACCESS_EXPIRA: 15m
      JWT_REFRESH_SECRETO: ${JWT_REFRESH_SECRETO:?define JWT_REFRESH_SECRETO}
      JWT_REFRESH_DIAS: 7
      SMTP_HOST: ${SMTP_HOST:?define SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CONTRASENA: ${SMTP_CONTRASENA:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE}
      ALMACENAMIENTO_DIR: /datos/almacenamiento
    volumes: ['almacenamiento:/datos/almacenamiento']
    ports: ['3001:3001']

volumes:
  pg_data:
  almacenamiento:
